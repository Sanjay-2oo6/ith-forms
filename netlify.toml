# Netlify deployment for ITH-FORMS (TanStack Start + Nitro).
#
# The build uses Nitro's `netlify` preset (set below and in vite.config.ts),
# which emits:
#   • static client assets  -> dist/            (the publish directory)
#   • the SSR server         -> .netlify/functions-internal/  (auto-detected)
# Nitro also auto-generates the routing redirects and headers, so no manual
# SPA-fallback rule is needed — non-asset requests are routed to the server
# function, which renders the HTML shell and applies src/server.ts (CSP + /health).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Match the app's toolchain; keeps the Nitro preset deterministic.
  NODE_VERSION = "20"
  NITRO_PRESET = "netlify"

  # Both VITE_ vars are frontend-safe Supabase config that is INTENTIONALLY
  # inlined into the client/SSR bundles by Vite at build time:
  #   • VITE_SUPABASE_URL      — the public API endpoint the browser calls
  #                              (visible in every network request)
  #   • VITE_SUPABASE_ANON_KEY — the public anon key (row-level security, not
  #                              secrecy, governs access)
  # Netlify's secret scanner otherwise fails the build on finding them in
  # dist/assets/*, the SSR output, and Nitro's intermediate files. Only these
  # two expected public values are omitted — scanning stays ON for everything
  # else (e.g. a service-role key would still correctly fail the build).
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"

# ─── REQUIRED: set these in the Netlify dashboard, NOT here ───────────────────
# The app cannot start without them (login shows "Configuration required"):
#
#   VITE_SUPABASE_URL       = https://<your-project-ref>.supabase.co
#   VITE_SUPABASE_ANON_KEY  = <your project's anon/public key>
#
# Set them under Site settings → Environment variables with a scope that
# INCLUDES "Builds" (they are inlined at build time — a Runtime-only scope
# will NOT work), then redeploy with "Clear cache and deploy site".
# They are deliberately NOT committed here so secrets stay out of the repo;
# the anon key is public by design. Never add the service-role key.
